name: CI

on:
  push:
    branches:
      - master
      - develop
      - "feature/**"
  pull_request:
    branches:
      - master
      - develop
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  discover:
    name: Discover modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.modules.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build module matrix
        id: modules
        run: python -m scripts.ci.discover_modules --github-output "$GITHUB_OUTPUT"

  repository:
    name: Repository contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Enforce repository and module policy
        run: python -m scripts.ci.check_repository

  quality:
    name: Static quality and application smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint maintained code
        run: python -m ruff check core/module_manager.py scripts/ci tests/ci

      - name: Check formatting
        run: python -m ruff format --check core/module_manager.py scripts/ci tests/ci

      - name: Compile all Python sources
        run: python -m compileall -q core modules scripts tests

      - name: Load every module without network access
        run: python -m scripts.ci.application_smoke

  tests:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify installed dependency set
        run: python -m pip check

      - name: Run unit tests with branch coverage
        run: python -m coverage run -m unittest discover -s tests -p "test_*.py" -v

      - name: Render coverage reports
        run: |
          python -m coverage report
          python -m coverage xml

      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python-3.13
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  modules:
    name: Module / ${{ matrix.module }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate module and run its tests
        run: python -m scripts.ci.run_module_checks "${{ matrix.module }}"

  security:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install audit tool
        run: python -m pip install pip-audit==2.10.1

      - name: Audit runtime dependencies
        run: python -m pip_audit --strict --progress-spinner off -r requirements.txt

  required:
    name: CI / required
    if: always()
    needs:
      - discover
      - repository
      - quality
      - tests
      - modules
      - security
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every CI stage
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          MODULES_RESULT: ${{ needs.modules.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          for result in \
            "$DISCOVER_RESULT" \
            "$REPOSITORY_RESULT" \
            "$QUALITY_RESULT" \
            "$TESTS_RESULT" \
            "$MODULES_RESULT" \
            "$SECURITY_RESULT"
          do
            test "$result" = "success"
          done
