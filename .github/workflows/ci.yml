name: CI

on:
  push:
    branches:
      - master
      - develop
      - "feature/**"
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check Sticker Vault lint
        run: python -m ruff check modules/sticker_vault tests/sticker_vault tests/module_loading

      - name: Check Sticker Vault formatting
        run: python -m ruff format --check modules/sticker_vault tests/sticker_vault tests/module_loading

      - name: Compile Python sources
        run: python -m compileall -q core modules tests

      - name: Run unit tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -p "test_*.py" -v
